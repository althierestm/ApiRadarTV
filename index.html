<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarTV - Ao Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background-color: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        video { 
            width: 100%; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
            background-color: #000;
        }
        .info-webtv { 
            margin-top: 20px; 
            padding: 15px; 
            background: #222; 
            border-radius: 8px; 
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .info-webtv p { margin: 10px; font-size: 16px; }
        .info-webtv span { font-weight: bold; color: #e50914; }
    </style>
</head>
<body>

    <div class="container">
        <h2>RadarTV - Ao Vivo</h2>
        <video id="video-player" controls autoplay muted></video>

        <div class="info-webtv">
            <p>Status: <span id="tv-status" style="color: #00ff00;">Carregando...</span></p>
            <p>🔴 Ao Vivo: <span id="tv-online">0</span> espectadores</p>
        </div>
    </div>

    <script>
        var video = document.getElementById('video-player');
        var videoSrc = 'https://www.latinasat.com.br/hls/live/stream/index.m3u8'; 

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        
        function carregarDadosWebTV() {
           
            fetch('https://radaraudiencia-default-rtdb.firebaseio.com/stats.json') 
                .then(response => response.json())
                .then(dados => {
                    if (dados && dados.viewers !== undefined) {
                        document.getElementById("tv-online").innerText = dados.viewers;
                        
                        let isOnline = dados.stream && dados.stream.active;
                        let tvStatus = document.getElementById("tv-status");
                        tvStatus.innerText = isOnline ? "Online" : "Offline";
                        tvStatus.style.color = isOnline ? "#00ff00" : "#ff0000";
                    }
                })
                .catch(erro => console.error("Erro ao carregar a audiência:", erro));
        }

        carregarDadosWebTV();
        
        setInterval(carregarDadosWebTV, 60000); 
    </script>
</body>
</html>
