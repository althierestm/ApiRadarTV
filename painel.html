<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Adm - Audiência Radar</title>
    <style>
        body { font-family: Arial; background: #222; color: #fff; padding: 30px; text-align: center; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; }
        .status { margin-top: 20px; font-size: 18px; color: #0f0; }
        .box { background: #333; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px;}
    </style>
</head>
<body>

    <h2>Painel Controlador de Audiência</h2>
    <div class="box">
        <label>Definir Audiência Base:</label>
        <input type="number" id="baseInput" value="10">
        <br><br>
        <button onclick="iniciarAutomacao()" id="btnIniciar" style="background:#28a745; color:#fff; border:none; cursor:pointer;">▶ Iniciar Oscilação Automática</button>
        <button onclick="pararAutomacao()" id="btnParar" style="background:#dc3545; color:#fff; border:none; cursor:pointer; display:none;">⏹ Parar</button>

        <div class="status" id="statusLog">Status: Parado</div>
        <div style="margin-top: 15px; font-size: 24px;">Espectadores Agora: <strong id="numeroAtualView" style="color:#ffc107;">0</strong></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // Conecta no SEU banco de dados da imagem
        const firebaseConfig = {
            databaseURL: "https://radaraudiencia-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let intervalo;
        let numeroAtual = 0;
        let rodando = false;

        window.iniciarAutomacao = function() {
            if (rodando) return;
            rodando = true;
            
            document.getElementById("btnIniciar").style.display = "none";
            document.getElementById("btnParar").style.display = "inline-block";
            
            let inputBase = parseInt(document.getElementById("baseInput").value);
            numeroAtual = inputBase; 
            
            document.getElementById("statusLog").innerText = "Status: Oscilando... (Atualiza a cada 2 min)";
            document.getElementById("statusLog").style.color = "#0f0";
            
            executarCiclo(); // Executa o primeiro tiro
            intervalo = setInterval(executarCiclo, 120000); // Repete a cada 2 minutos (120000 ms)
        };

        window.pararAutomacao = function() {
            rodando = false;
            clearInterval(intervalo);
            document.getElementById("btnIniciar").style.display = "inline-block";
            document.getElementById("btnParar").style.display = "none";
            document.getElementById("statusLog").innerText = "Status: Parado";
            document.getElementById("statusLog").style.color = "#dc3545";
        };

        async function executarCiclo() {
            let numeroBase = parseInt(document.getElementById("baseInput").value);
            
            // Regra: Máximo de +7 e Mínimo de -2
            let limiteMax = numeroBase + 7;
            let limiteMin = (numeroBase - 2 < 0) ? 0 : numeroBase - 2;

            // Sorteia o passo: cai 1, mantém zero, sobe 1 ou sobe 2
            let passo = Math.floor(Math.random() * 4) - 1; 
            numeroAtual += passo;

            // Bloqueia para não passar dos limites
            if (numeroAtual > limiteMax) numeroAtual = limiteMax;
            if (numeroAtual < limiteMin) numeroAtual = limiteMin;

            document.getElementById("numeroAtualView").innerText = numeroAtual;

            // Estrutura do JSON que o IMA Web aceita (simulando a Latinasat)
            let dadosFalsos = {
                "connections": numeroAtual,
                "active_connections": numeroAtual,
                "viewers": numeroAtual,
                "online": numeroAtual,
                "stream": {
                    "active": true,
                    "clients": numeroAtual
                }
            };

            try {
                // Envia para o nó 'stats' no Firebase
                await set(ref(db, 'stats'), dadosFalsos);
                console.log("Atualizado no banco: " + numeroAtual);
            } catch (erro) {
                console.error("Erro ao enviar para Firebase:", erro);
            }
        }
    </script>
</body>
</html>
